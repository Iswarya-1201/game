# Database connection: Render reads these values from the service Environment.
# For Aiven MySQL, set DB_HOST, DB_PORT, DB_NAME, DB_USER and DB_PASSWORD in Render.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:playcode}?sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=30000&socketTimeout=60000
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Render injects PORT automatically; 8080 is only the local fallback.
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
